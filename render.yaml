services:
  # Backend .NET API
  - type: web
    name: enterprise-dashboard-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
    healthCheckPath: /api/dashboard

  # Frontend Angular App
  - type: web
    name: enterprise-dashboard-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend/enterprise-ai-dashboard-ui && npm install && npm run build -- --configuration production
    startCommand: cd frontend/enterprise-ai-dashboard-ui && npx http-server dist/enterprise-ai-dashboard-ui/browser -p $PORT --proxy http://localhost:$PORT?
    envVars:
      - key: NODE_VERSION
        value: 18
