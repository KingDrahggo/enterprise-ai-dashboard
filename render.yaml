services:
  # Backend .NET API
  - type: web
    name: enterprise-dashboard-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
    healthCheckPath: /api/dashboard

  # Frontend Angular App
  - type: static
    name: enterprise-dashboard-frontend
    buildCommand: cd frontend/enterprise-ai-dashboard-ui && npm install && npm run build -- --configuration production
    staticPublishPath: frontend/enterprise-ai-dashboard-ui/dist/enterprise-ai-dashboard-ui/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
