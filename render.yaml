services:
  # Backend .NET API
  - type: web
    name: enterprise-dashboard-api
    runtime: dotnet
    region: oregon
    plan: free
    buildCommand: dotnet publish -c Release -o out backend/EnterpriseAiDashboard.Api/EnterpriseAiDashboard.Api.csproj
    startCommand: dotnet out/EnterpriseAiDashboard.Api.dll
    envVars:
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:$PORT
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
    healthCheckPath: /api/dashboard

  # Frontend Angular App
  - type: web
    name: enterprise-dashboard-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend/enterprise-ai-dashboard-ui && npm install && npm run build -- --configuration production
    staticPublishPath: frontend/enterprise-ai-dashboard-ui/dist/enterprise-ai-dashboard-ui/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
