<div class="card ai-panel">
    <div class="header">
        <h3 class="neon-text-pink">AI COMMAND CENTER</h3>
        <div class="status-indicator" [class.active]="loading">
            <span class="dot"></span> {{ loading ? 'PROCESSING' : 'ONLINE' }}
        </div>
    </div>

    <div class="chat-window">
        @for (msg of messages; track msg) {
            <div class="message" [class.user]="msg.sender === 'user'" [class.ai]="msg.sender === 'ai'">
                <div class="bubble">
                    <p>{{ msg.text }}</p>
                    <span class="time">{{ msg.time | date:'shortTime' }}</span>
                </div>
            </div>
        }
        @if (loading) {
            <div class="message ai">
                <div class="bubble typing">
                    <span>.</span><span>.</span><span>.</span>
                </div>
            </div>
        }
    </div>

    <div class="input-area">
        <input 
            type="text" 
            [(ngModel)]="prompt" 
            (keyup.enter)="askAi()" 
            placeholder="Ask AI for insights..." 
            [disabled]="loading"
        >
        <button class="btn-neon" (click)="askAi()" [disabled]="loading">SEND</button>
    </div>
</div>
